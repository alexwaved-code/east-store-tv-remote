    <h1>East Store TV 私隱政策</h1>
    <p>East Store TV 是示範用的店內廣告播放器。網站只供店內電視與店員手機配對使用。</p>
    <h2>收集什麼資料</h2>
    <p>不會開帳戶，也不會收集姓名、電話或付款資料。系統只暫存房間代碼、播放狀態與連線中的裝置識別，用來同步電視與遙控。</p>
    <h2>片源</h2>
    <p>廣告片由本站直連 mp4 播放，不經 YouTube 嵌入。</p>
    <h2>聯絡</h2>
    <p>這是開源示範專案，沒有正式客服。請在 GitHub Issues 提問。</p>
